<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>活動報告</title><style>
:root{--ink:#2b2f3a;--navy:#3b4675;--gold:#ffcd44;--gold-ink:#8a6a10;--bg:#f6f3eb;--card:#fff;--line:#e6e1d3;--muted:#6b6f7b;--bar:#c9cde0}
@media (prefers-color-scheme:dark){:root{--ink:#e8e8ee;--navy:#aab4e8;--bg:#16181f;--card:#20232c;--line:#323644;--muted:#9a9eab;--bar:#4a5180;--gold-ink:#ffcd44}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"BIZ UDPGothic","Hiragino Sans","Meiryo",sans-serif;line-height:1.6}
main{max-width:720px;margin:0 auto;padding:16px 16px 40px}header h1{margin:2px 0 0;font-size:24px;color:var(--navy)}.kick{margin:0;color:var(--gold-ink);font-size:13px;font-weight:bold}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.tile{background:var(--card);border-radius:10px;padding:10px;border-top:4px solid var(--gold)}
.tl{font-size:12px;color:var(--muted)}.tv{font-size:20px;font-weight:bold;color:var(--navy);font-variant-numeric:tabular-nums}.ts{font-size:11px;color:var(--muted)}
@media(max-width:560px){.tiles{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--card);border-radius:12px;padding:14px 16px;margin:12px 0}.card h2{margin:0 0 4px;font-size:18px;color:var(--navy);border-left:5px solid var(--gold);padding-left:8px}
.card h3{font-size:14px;margin:16px 0 6px;color:var(--navy)}.big{font-size:28px;font-weight:bold;margin:4px 0;color:var(--navy);font-variant-numeric:tabular-nums}.big small{font-size:13px;color:var(--muted);font-weight:normal;margin-right:6px}
.muted{color:var(--muted);font-size:13px;margin:2px 0}a{color:var(--navy)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-top:1px solid var(--line);vertical-align:top;text-align:left}th{font-size:12px;color:var(--muted);font-weight:normal}
.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}.t{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
.chart{display:flex;gap:3px;height:130px}.col{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}.val{font-size:10px;color:var(--muted);height:14px}
.track{flex:1;width:100%;display:flex;align-items:flex-end}.bar{width:100%;background:var(--bar);border-radius:4px 4px 0 0}.bar.now{background:var(--gold)}
.lab{font-size:10px;color:var(--muted);text-align:center;white-space:pre-line;line-height:1.2;margin-top:3px}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden}.legend{list-style:none;padding:0;margin:6px 0;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.s0{background:#3b4675}.s1{background:#ffcd44}.s2{background:#6fa8dc}.s3{background:#e88b6e}.s4{background:#8fbf8f}.s5{background:#b9a6d6}
.gauge{position:relative;height:12px;background:var(--line);border-radius:6px;overflow:hidden}.fill{height:100%;background:var(--navy)}.tick{position:absolute;top:0;bottom:0;width:2px;background:var(--gold-ink)}
.scroll{overflow-x:auto}.hist{min-width:400px}.hist.wide{min-width:640px}.hist th{white-space:nowrap}.subh{margin:26px 0 4px;font-size:15px;color:var(--muted)}.warn h2{border-color:#d9534f}.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:20px}
#msg{color:var(--muted);text-align:center;padding:40px 0}
table.rep th{background:var(--navy);color:#fff;font-weight:bold;padding:7px 8px}table.rep td{padding:8px}
@media (prefers-color-scheme:dark){table.rep th{color:#16181f}}
table.rep .cnt,table.rep .val{font-weight:bold;white-space:nowrap;font-size:15px;color:var(--navy)}
table.rep .cmp{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}table.rep .memo{display:block;color:var(--muted);font-size:11px;font-weight:normal;white-space:normal}.nw{white-space:nowrap}
table.rep tr.grp td{border-top:0;padding-top:14px;border-bottom:2px solid var(--line)}
.mt{display:inline-block;padding:1px 8px;border-radius:10px;color:#fff;font-size:11px;font-weight:bold;white-space:nowrap}
.m-ブログ{background:#3b4675}.m-X{background:#111}.m-Instagram{background:#c13584}.m-note{background:#2cb696}
</style></head><body><main id="app"><p id="msg">読み込み中…</p></main>

const k=new URLSearchParams(location.hash.slice(1)).get('k');if(!k){m.textContent='このページはメールか司令塔のリンクから開いてください。';return}
const b=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
const raw=b(D),key=await crypto.subtle.importKey('raw',b(k),'AES-GCM',false,['decrypt']);
const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(0,12)},key,raw.slice(12));
document.getElementById('app').innerHTML=new TextDecoder().decode(pt);}catch(e){m.textContent='ページを開けませんでした（リンクが途中で切れているかもしれません）。'}})();
