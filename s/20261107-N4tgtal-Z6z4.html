<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>今日の支出</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1f2328;--muted:#6b6f76;--line:#e6e3dc;--accent:#2e7d32;--warn:#c62828;--bar:#a5c8a7;--total:#d9480f;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#16181b;--card:#202327;--ink:#eceae5;--muted:#a0a4aa;--line:#33373c;--accent:#66bb6a;--warn:#ef6b6b;--bar:#3f6b42;--total:#ff9a5c;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 'Hiragino Sans','Noto Sans JP','Meiryo',sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
.eyebrow{margin:0;color:var(--accent);font-weight:700;font-size:13px;letter-spacing:.08em}h1{margin:2px 0 16px;font-size:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
h2{margin:0 0 6px;font-size:15px;color:var(--muted);font-weight:600}
.big{margin:0 0 10px;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}.big small{font-size:14px;color:var(--muted);font-weight:400}
.big{color:var(--total)}.big.ok{color:var(--accent)}summary b{color:var(--total)}.big.over{color:var(--warn)}
table{width:100%;border-collapse:collapse}td{padding:8px 4px;border-top:1px solid var(--line);vertical-align:top}
td.t{color:var(--muted);width:52px;font-variant-numeric:tabular-nums}td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.muted{color:var(--muted);font-size:14px;margin:4px 0}.note{color:var(--muted);font-size:12px;margin:10px 0 0}
.chart{display:flex;gap:6px;height:150px;margin:12px 0 10px}.col{flex:1;display:flex;flex-direction:column;align-items:center}
.val{font-size:11px;color:var(--muted);height:16px}.track{flex:1;width:100%;display:flex;align-items:flex-end}
.bar{width:100%;background:var(--bar);border-radius:6px 6px 0 0}.bar.today{background:var(--accent)}.lab{font-size:12px;color:var(--muted);text-align:center;line-height:1.3;margin-top:4px}
details{border-top:1px solid var(--line)}summary{display:flex;justify-content:space-between;padding:10px 4px;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}summary span:before{content:'▸ ';color:var(--muted)}details[open] summary span:before{content:'▾ '}
.gauge{height:12px;background:var(--line);border-radius:6px;overflow:hidden}.fill{height:100%;background:var(--accent)}.fill.over{background:var(--warn)}
.cat summary small{color:var(--muted);font-size:12px;font-weight:400}.cbar{height:6px;background:var(--line);border-radius:3px;margin:0 4px 6px;overflow:hidden}.cbar div{height:100%;background:var(--bar)}.sub{margin:0 4px 6px;font-size:13px}
.advice p{margin:0 0 10px}.advice{border-left:4px solid var(--accent)}
.foot{font-size:12px;color:var(--muted)}#msg{color:var(--muted);text-align:center;padding:40px 0}
</style></head><body><main id="app"><p id="msg">読み込み中…</p></main>

(async()=>{const m=document.getElementById('msg');try{
const k=new URLSearchParams(location.hash.slice(1)).get('k');if(!k){m.textContent='このページはメールのリンクから開いてください。';return}
const b=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
const raw=b(D),key=await crypto.subtle.importKey('raw',b(k),'AES-GCM',false,['decrypt']);
const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(0,12)},key,raw.slice(12));
document.getElementById('app').innerHTML=new TextDecoder().decode(pt);}catch(e){m.textContent='ページを開けませんでした（リンクが途中で切れているかもしれません）。'}})();
</script></body></html>
